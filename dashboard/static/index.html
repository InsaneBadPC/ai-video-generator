<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Music Video Generator</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="icon" href="/static/icon.svg"><meta name="theme-color" content="#3c82f6"><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#10131a;color:#eef1f7}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:1.5rem}.cards{display:flex;gap:10px;flex-wrap:wrap}.card,.panel,.job{background:#1b2130;border:1px solid #30394d;border-radius:10px;padding:12px}.panel{margin:14px 0}.jobs{display:grid;gap:10px;margin-top:18px}.meta{color:#aab4c8;font-size:.88rem}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:7px;padding:10px 14px;background:#3c82f6;color:#fff;cursor:pointer}button:disabled{opacity:.55}button.reject{background:#b93852}button.retry{background:#5a667d}code{color:#9bd1ff}.error{color:#ff9cae}.formgrid{display:grid;gap:10px}.formgrid input,.formgrid textarea,.formgrid select{box-sizing:border-box;width:100%;padding:11px;border-radius:7px;border:1px solid #3b465d;background:#10131a;color:#eef1f7}.formgrid textarea{min-height:90px}.progress{height:12px;background:#30394d;border-radius:8px;overflow:hidden;margin-top:9px}.bar{height:100%;background:#3c82f6;transition:width .4s}.download{display:inline-block;margin-top:10px;color:#fff;background:#16865b;padding:9px 12px;border-radius:7px;text-decoration:none}
</style></head><body><main><h1>AI Music Video Generator</h1><section class="panel"><h2>Nové video</h2><form id="generate" class="formgrid"><label>Prompt / text písně<textarea name="prompt" placeholder="Popiš scénu a co se má hýbat"></textarea></label><label>MP3 / audio<input name="audio" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg" required></label><label>Obrázek (povinný pro animaci)<input name="image" type="file" accept="image/*"></label><label>Název<input name="title" value="Temney"></label><label>Režim<select name="mode"><option value="full_scenes">Klasické video – scény podle promptu</option><option value="image_animation">Jen rozhýbat obrázek – loop animace</option></select></label><button id="submit" type="submit">Spustit generování</button><span id="submitmsg" class="meta"></span></form></section><div id="stats" class="cards"></div><h2>Generování</h2><section id="runs" class="jobs"></section><h2>Produkční zdroje</h2><div id="resources" class="cards"></div><p id="message" class="meta">Načítám…</p><section id="jobs" class="jobs"></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function action(id,a){await api('/api/jobs/'+encodeURIComponent(id)+'/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a})});load()}
function runCard(x){const p=Math.max(0,Math.min(100,x.progress||0));return `<article class="job"><b>${esc(x.title)}</b><div class="meta">${esc(x.mode)} · ${esc(x.status)} · ${esc(x.message||'')} · ${esc(x.audio)}</div><div>${esc(x.prompt)}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="meta">${p}%</div>${x.download?`<a class="download" href="${esc(x.download)}" download>Stáhnout video</a>`:''}</article>`}
async function load(){try{const [s,j,r,runs]=await Promise.all([api('/api/stats'),api('/api/jobs'),api('/api/resources'),api('/api/runs')]);document.querySelector('#stats').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><br><strong>${v}</strong></div>`).join('')||'<div class="card">Fronta je prázdná</div>';document.querySelector('#resources').innerHTML=Object.entries(r).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><br>${v?'dostupné':'vypnuto'}</div>`).join('');document.querySelector('#runs').innerHTML=runs.map(runCard).join('')||'<div class="card">Žádné generování</div>';document.querySelector('#jobs').innerHTML=j.map(x=>`<article class="job"><b>${esc(x.song_id)} / ${esc(x.label)}</b><div class="meta">${esc(x.status)} · tier ${esc(x.tier||'-')} · pokus ${x.attempts} · job <code>${esc(x.job_id)}</code></div>${x.error?`<div class="error">${esc(x.error)}</div>`:''}<div class="actions"><button onclick="action('${esc(x.job_id)}','approve')">Schválit / Retry</button><button class="reject" onclick="action('${esc(x.job_id)}','reject')">Zamítnout</button><button class="retry" onclick="action('${esc(x.job_id)}','retry')">Vrátit do fronty</button></div></article>`).join('')||'<div class="card">Žádné úlohy</div>';document.querySelector('#message').textContent='Aktualizováno '+new Date().toLocaleTimeString()}catch(e){document.querySelector('#message').textContent='Chyba: '+e.message;document.querySelector('#message').className='error'}}
document.querySelector('#generate').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#submit'),m=document.querySelector('#submitmsg');b.disabled=true;m.textContent='Nahrávám soubory…';try{const r=await api('/api/generate',{method:'POST',body:new FormData(e.target)});m.textContent='Generování spuštěno: '+r.run_id;e.target.reset();await load()}catch(err){m.textContent='Chyba: '+err.message;m.className='error'}finally{b.disabled=false}});load();setInterval(load,2000);
</script></body></html>
